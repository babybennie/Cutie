<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bennie Choco ♡ Agent Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --pink:#ffdce9;
  --pink2:#fff0f6;
  --lavender:#e9e0ff;
  --lavender2:#f5f0ff;
  --blue:#dff0ff;
  --blue2:#edf7ff;
  --cream:#fffaf2;
  --mint:#def7ef;
  --mint2:#effcf8;
  --dark:#51475b;
  --muted:#8d8395;
  --white:#ffffff;
  --red:#f6b4bd;
  --redText:#9d4d59;
  --green:#bcebd7;
  --greenText:#34755d;
  --shadow:0 10px 30px rgba(100,80,120,.10);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:'Kanit',sans-serif;
  color:var(--dark);
  background:
    radial-gradient(circle at top left, #fff1f7 0%, transparent 35%),
    radial-gradient(circle at top right, #eee7ff 0%, transparent 35%),
    linear-gradient(135deg,#fffafc,#f8f5ff,#f5fbff);
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}

/* =========================
   LOGIN
========================= */

.login-wrap{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:22px;
}

.login-card{
  width:100%;
  max-width:430px;
  background:rgba(255,255,255,.92);
  border-radius:30px;
  padding:32px 24px;
  box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.9);
}

.brand{
  text-align:center;
  margin-bottom:26px;
}

.brand-icon{
  width:72px;
  height:72px;
  margin:0 auto 12px;
  border-radius:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  background:linear-gradient(135deg,var(--pink),var(--lavender),var(--blue));
  box-shadow:var(--shadow);
}

.brand-title{
  font-family:'Playfair Display',serif;
  font-size:27px;
  margin:0;
  color:#51445b;
}

.brand-sub{
  margin-top:5px;
  color:var(--muted);
  font-size:14px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  font-weight:500;
}

.form-group input{
  width:100%;
  border:none;
  outline:none;
  border-radius:16px;
  padding:13px 15px;
  background:#faf8fc;
  color:var(--dark);
  box-shadow:inset 0 0 0 1px #eee8f2;
  font-size:15px;
}

.form-group input:focus{
  box-shadow:inset 0 0 0 2px #ddccef;
  background:#fff;
}

.login-btn{
  width:100%;
  border:none;
  border-radius:17px;
  padding:14px 18px;
  background:linear-gradient(135deg,#f7cfe0,#ddd0fa,#cfeaff);
  color:var(--dark);
  font-size:16px;
  font-weight:500;
  box-shadow:var(--shadow);
  transition:.2s;
}

.login-btn:hover{
  transform:translateY(-2px);
}

.login-error{
  margin-top:14px;
  padding:11px 13px;
  border-radius:14px;
  background:#fff0f2;
  color:#a24f5c;
  font-size:13px;
  text-align:center;
}

/* =========================
   ADMIN APP
========================= */

.admin-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:20px 15px 45px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}

.topbar-brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.topbar-icon{
  width:50px;
  height:50px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  background:linear-gradient(135deg,var(--pink),var(--lavender),var(--blue));
  box-shadow:var(--shadow);
}

.topbar-title{
  font-family:'Playfair Display',serif;
  font-size:23px;
  margin:0;
}

.topbar-sub{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.small-btn{
  border:none;
  border-radius:14px;
  padding:10px 13px;
  font-size:13px;
  color:var(--dark);
  background:white;
  box-shadow:var(--shadow);
}

.small-btn:hover{
  transform:translateY(-1px);
}

.logout-btn{
  background:#fff0f2;
  color:#9d4d59;
}

.back-btn{
  background:#f1ecff;
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:15px;
}

.stat-card{
  background:rgba(255,255,255,.9);
  border-radius:22px;
  padding:18px;
  box-shadow:var(--shadow);
}

.stat-label{
  font-size:13px;
  color:var(--muted);
}

.stat-number{
  font-size:27px;
  font-weight:600;
  margin-top:3px;
}

/* =========================
   SEARCH
========================= */

.search-card{
  background:rgba(255,255,255,.92);
  border-radius:22px;
  padding:14px;
  box-shadow:var(--shadow);
  margin-bottom:15px;
}

.search-input{
  width:100%;
  border:none;
  outline:none;
  border-radius:16px;
  background:#faf8fc;
  padding:13px 15px;
  font-size:15px;
  color:var(--dark);
}

.search-input:focus{
  box-shadow:inset 0 0 0 2px #e0d4ee;
}

/* =========================
   AGENT LIST
========================= */

.agent-list{
  display:grid;
  gap:14px;
}

.agent-card{
  background:rgba(255,255,255,.94);
  border-radius:24px;
  padding:17px;
  box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.9);
}

.agent-main{
  display:flex;
  gap:15px;
  align-items:flex-start;
}

.agent-photo{
  width:82px;
  height:82px;
  border-radius:22px;
  object-fit:cover;
  flex:none;
  background:linear-gradient(135deg,var(--pink2),var(--lavender2),var(--blue2));
  box-shadow:0 5px 18px rgba(100,80,120,.12);
}

.agent-photo.empty{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.agent-info{
  flex:1;
  min-width:0;
}

.agent-name{
  font-size:20px;
  font-weight:500;
  margin-bottom:2px;
}

.agent-code{
  display:inline-block;
  padding:4px 9px;
  border-radius:10px;
  background:var(--lavender2);
  font-size:12px;
  color:#756583;
  margin-bottom:8px;
}

.status{
  display:inline-block;
  border-radius:10px;
  padding:4px 9px;
  font-size:12px;
  margin-left:4px;
}

.status.active{
  background:var(--mint);
  color:var(--greenText);
}

.status.inactive{
  background:#ffe5e8;
  color:var(--redText);
}

.agent-meta{
  font-size:13px;
  color:var(--muted);
  line-height:1.65;
}

.meta-label{
  color:#716779;
  font-weight:500;
}

.channel-list{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:7px;
}

.channel-tag{
  background:var(--blue2);
  color:#617487;
  border-radius:10px;
  padding:4px 8px;
  font-size:11px;
}

/* =========================
   ACTIONS
========================= */

.agent-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
  padding-top:13px;
  border-top:1px solid #f0ebf2;
}

.action-btn{
  border:none;
  border-radius:13px;
  padding:9px 12px;
  font-size:13px;
  color:var(--dark);
}

.edit-btn{
  background:#eee7ff;
}

.toggle-btn{
  background:#e3f8ef;
}

.delete-btn{
  background:#fff0f2;
  color:#9d4d59;
}

/* =========================
   EMPTY / LOADING
========================= */

.center-box{
  background:rgba(255,255,255,.92);
  border-radius:22px;
  padding:30px 20px;
  text-align:center;
  box-shadow:var(--shadow);
  color:var(--muted);
}

/* =========================
   MODAL
========================= */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(55,45,65,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:100;
  overflow:auto;
}

.modal{
  width:100%;
  max-width:560px;
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:28px;
  padding:22px;
  box-shadow:0 20px 60px rgba(60,45,80,.2);
}

.modal-title{
  font-family:'Playfair Display',serif;
  font-size:23px;
  margin-bottom:17px;
}

.modal-grid{
  display:grid;
  gap:13px;
}

.modal-group label{
  display:block;
  font-size:13px;
  margin-bottom:6px;
  color:#756a7b;
}

.modal-group input{
  width:100%;
  border:none;
  outline:none;
  background:#faf8fc;
  border-radius:14px;
  padding:11px 13px;
  box-shadow:inset 0 0 0 1px #eee8f2;
  font-size:14px;
  color:var(--dark);
}

.modal-group input:focus{
  box-shadow:inset 0 0 0 2px #ded1ee;
}

.check-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.check-item{
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px 10px;
  border-radius:12px;
  background:#faf8fc;
  font-size:13px;
}

.check-item input{
  accent-color:#bca8d5;
}

.modal-buttons{
  display:flex;
  gap:9px;
  margin-top:20px;
}

.modal-buttons button{
  flex:1;
  border:none;
  border-radius:15px;
  padding:12px;
  font-size:14px;
}

.save-btn{
  background:linear-gradient(135deg,#f6d5e3,#ded3fa);
}

.cancel-btn{
  background:#f5f2f6;
  color:#716779;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(20px);
  background:#51475b;
  color:white;
  padding:11px 16px;
  border-radius:14px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:500;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

  .admin-wrap{
    padding:15px 12px 35px;
  }

  .topbar{
    align-items:flex-start;
  }

  .topbar-title{
    font-size:20px;
  }

  .top-actions{
    width:100%;
  }

  .topbar{
    flex-direction:column;
  }

  .top-actions{
    justify-content:flex-start;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .agent-main{
    gap:11px;
  }

  .agent-photo{
    width:68px;
    height:68px;
    border-radius:18px;
  }

  .agent-name{
    font-size:18px;
  }

  .check-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN PAGE

<section id="loginPage" class="login-wrap">

  <div class="login-card">

    <div class="brand">

      <div class="brand-icon">
        🍫
      </div>

<!-- TOAST -->

<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "ใส่-SUPABASE-URL-ตรงนี้";

const SUPABASE_PUBLISHABLE_KEY =
  "ใส่-SUPABASE-PUBLISHABLE-KEY-ตรงนี้";


/* =====================================================
   INIT
===================================================== */

let supabaseClient = null;

let agents = [];

let editingAgentId = null;


function isSupabaseConfigured(){

  return (
    SUPABASE_URL &&
    SUPABASE_PUBLISHABLE_KEY &&
    !SUPABASE_URL.includes("ใส่-") &&
    !SUPABASE_PUBLISHABLE_KEY.includes("ใส่-")
  );

}


if(isSupabaseConfigured()){

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

}


/* =====================================================
   DOM
===================================================== */

const loginPage =
  document.getElementById("loginPage");

const adminPage =
  document.getElementById("adminPage");

const loginForm =
  document.getElementById("loginForm");

const loginBtn =
  document.getElementById("loginBtn");

const loginError =
  document.getElementById("loginError");

const agentList =
  document.getElementById("agentList");

const searchInput =
  document.getElementById("searchInput");

const editModal =
  document.getElementById("editModal");


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    if(!supabaseClient){

      showLoginError(
        "ยังไม่ได้ใส่ Supabase URL และ Publishable Key"
      );

      return;
    }


    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("loginPassword")
        .value;


    loginBtn.disabled = true;

    loginBtn.textContent =
      "กำลังเข้าสู่ระบบ...";

    hideLoginError();


    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if(error){

      showLoginError(
        "เข้าสู่ระบบไม่สำเร็จ: " +
        error.message
      );

      loginBtn.disabled = false;

      loginBtn.textContent =
        "🔐 เข้าสู่หลังบ้าน";

      return;
    }


    const isAdmin =
      await verifyAdmin();


    if(!isAdmin){

      await supabaseClient.auth.signOut();

      showLoginError(
        "บัญชีนี้ไม่มีสิทธิ์เป็นแอดมิน"
      );

      loginBtn.disabled = false;

      loginBtn.textContent =
        "🔐 เข้าสู่หลังบ้าน";

      return;
    }


    loginPage.classList.add("hidden");

    adminPage.classList.remove("hidden");

    loginBtn.disabled = false;

    loginBtn.textContent =
      "🔐 เข้าสู่หลังบ้าน";


    await loadAgents();

  }
);


/* =====================================================
   VERIFY ADMIN
===================================================== */

async function verifyAdmin(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "is_admin"
      );


    if(error){

      console.error(
        "is_admin error:",
        error
      );

      return false;
    }


    return data === true;

  }catch(err){

    console.error(err);

    return false;

  }

}


/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkExistingSession(){

  if(!supabaseClient){

    return;
  }


  const {
    data
  } =
    await supabaseClient.auth.getSession();


  const session =
    data?.session;


  if(!session){

    return;
  }


  const isAdmin =
    await verifyAdmin();


  if(!isAdmin){

    await supabaseClient.auth.signOut();

    return;
  }


  loginPage.classList.add("hidden");

  adminPage.classList.remove("hidden");


  await loadAgents();

}


/* =====================================================
   LOAD AGENTS
===================================================== */

async function loadAgents(){

  agentList.innerHTML = `
    <div class="center-box">
      ⏳ กำลังโหลดข้อมูลตัวแทน...
    </div>
  `;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("agents")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    agentList.innerHTML = `
      <div class="center-box">
        ❌ โหลดข้อมูลไม่สำเร็จ<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  agents = data || [];


  updateStats();

  renderAgents();

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  const total =
    agents.length;

  const active =
    agents.filter(
      a => a.status === "active"
    ).length;

  const inactive =
    agents.filter(
      a => a.status === "inactive"
    ).length;


  document.getElementById(
    "totalCount"
  ).textContent = total;


  document.getElementById(
    "activeCount"
  ).textContent = active;


  document.getElementById(
    "inactiveCount"
  ).textContent = inactive;

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
  "input",
  renderAgents
);


/* =====================================================
   RENDER
===================================================== */

function renderAgents(){

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    agents.filter(agent => {

      const nickname =
        String(
          agent.nickname || ""
        ).toLowerCase();

      const code =
        String(
          agent.agent_code || ""
        ).toLowerCase();


      return (
        !keyword ||
        nickname.includes(keyword) ||
        code.includes(keyword)
      );

    });


  if(!filtered.length){

    agentList.innerHTML = `
      <div class="center-box">
        🔎 ไม่พบตัวแทนที่ค้นหา
      </div>
    `;

    return;
  }


  agentList.innerHTML =
    filtered
      .map(renderAgentCard)
      .join("");

}


/* =====================================================
   AGENT CARD
===================================================== */

function renderAgentCard(agent){

  const statusClass =
    agent.status === "active"
      ? "active"
      : "inactive";


  const statusText =
    agent.status === "active"
      ? "🟢 Active"
      : "🔴 Inactive";


  const contacts =
    agent.contacts || {};


  const channels =
    Array.isArray(agent.sales_channels)
      ? agent.sales_channels
      : [];


  const channelHtml =
    channels.length
      ? channels
          .map(
            channel => `
              <span class="channel-tag">
                ${escapeHtml(
                  formatSalesChannel(channel)
                )}
              </span>
            `
          )
          .join("")
      : `
          <span class="channel-tag">
            ยังไม่ได้ระบุ
          </span>
        `;


  const photoHtml =
    agent.photo_url
      ? `
        <img
          class="agent-photo"
          src="${escapeAttr(agent.photo_url)}"
          alt="รูปตัวแทน"
        >
      `
      : `
        <div class="agent-photo empty">
          🧸
        </div>
      `;


  return `

    <div
      class="agent-card"
      data-id="${escapeAttr(agent.id)}"
    >

      <div class="agent-main">

        ${photoHtml}

        <div class="agent-info">

          <div class="agent-name">
            ${escapeHtml(
              agent.nickname || "-"
            )}
          </div>

          <span class="agent-code">
            ${escapeHtml(
              agent.agent_code || "-"
            )}
          </span>

          <span class="status ${statusClass}">
            ${statusText}
          </span>

          <div class="agent-meta">

            <div>
              <span class="meta-label">
                สมัครเมื่อ:
              </span>
              ${formatDate(agent.joined_date)}
            </div>

            <div>
              <span class="meta-label">
                LINE:
              </span>
              ${escapeHtml(
                contacts.line || "-"
              )}
            </div>

            <div>
              <span class="meta-label">
                Facebook:
              </span>
              ${escapeHtml(
                contacts.facebook || "-"
              )}
            </div>

            <div>
              <span class="meta-label">
                Instagram:
              </span>
              ${escapeHtml(
                contacts.instagram || "-"
              )}
            </div>

            <div style="margin-top:5px;">
              <span class="meta-label">
                ช่องทางขาย:
              </span>
            </div>

            <div class="channel-list">
              ${channelHtml}
            </div>

          </div>

        </div>

      </div>


      <div class="agent-actions">

        <button
          class="action-btn edit-btn"
          onclick="openEditModal('${escapeAttr(agent.id)}')"
        >
          ✏️ แก้ไข
        </button>


        <button
          class="action-btn toggle-btn"
          onclick="toggleStatus('${escapeAttr(agent.id)}')"
        >
          ${
            agent.status === "active"
              ? "🔴 ปิดการใช้งาน"
              : "🟢 เปิดใช้งาน"
          }
        </button>


        <button
          class="action-btn delete-btn"
          onclick="deleteAgent('${escapeAttr(agent.id)}')"
        >
          🗑️ ลบ
        </button>

      </div>

    </div>

  `;

}


/* =====================================================
   OPEN EDIT
===================================================== */

function openEditModal(id){

  const agent =
    agents.find(
      item => item.id === id
    );


  if(!agent){

    showToast(
      "ไม่พบข้อมูลตัวแทน"
    );

    return;
  }


  editingAgentId =
    id;


  const contacts =
    agent.contacts || {};


  const channels =
    Array.isArray(agent.sales_channels)
      ? agent.sales_channels
      : [];


  document.getElementById(
    "editCode"
  ).value =
    agent.agent_code || "";


  document.getElementById(
    "editNickname"
  ).value =
    agent.nickname || "";


  document.getElementById(
    "editLine"
  ).value =
    contacts.line || "";


  document.getElementById(
    "editFacebook"
  ).value =
    contacts.facebook || "";


  document.getElementById(
    "editInstagram"
  ).value =
    contacts.instagram || "";


  document.getElementById(
    "editStatus"
  ).value =
    agent.status || "active";


  document
    .querySelectorAll(".edit-channel")
    .forEach(box => {

      box.checked =
        channels.includes(
          box.value
        );

    });


  editModal.classList.remove(
    "hidden"
  );

}


/* =====================================================
   CLOSE EDIT
===================================================== */

function closeEditModal(){

  editingAgentId = null;

  editModal.classList.add(
    "hidden"
  );

}


/* =====================================================
   SAVE EDIT
===================================================== */

async function saveEdit(){

  if(!editingAgentId){

    return;
  }


  const nickname =
    document.getElementById(
      "editNickname"
    ).value.trim();


  if(!nickname){

    showToast(
      "กรุณากรอกชื่อเล่น"
    );

    return;
  }


  const line =
    document.getElementById(
      "editLine"
    ).value.trim();


  const facebook =
    document.getElementById(
      "editFacebook"
    ).value.trim();


  const instagram =
    document.getElementById(
      "editInstagram"
    ).value.trim();


  const status =
    document.getElementById(
      "editStatus"
    ).value;


  const salesChannels =
    Array.from(
      document.querySelectorAll(
        ".edit-channel:checked"
      )
    ).map(
      checkbox => checkbox.value
    );


  const contacts = {

    line: line,

    facebook: facebook,

    instagram: instagram

  };


  const saveBtn =
    document.getElementById(
      "saveEditBtn"
    );


  saveBtn.disabled = true;

  saveBtn.textContent =
    "กำลังบันทึก...";


  const {
    error
  } =
    await supabaseClient
      .from("agents")
      .update({

        nickname: nickname,

        contacts: contacts,

        sales_channels: salesChannels,

        status: status

      })
      .eq(
        "id",
        editingAgentId
      );


  if(error){

    console.error(error);

    showToast(
      "บันทึกไม่สำเร็จ: " +
      error.message
    );

    saveBtn.disabled = false;

    saveBtn.textContent =
      "💾 บันทึก";

    return;
  }


  closeEditModal();

  showToast(
    "บันทึกข้อมูลเรียบร้อยแล้ว ♡"
  );


  await loadAgents();


  saveBtn.disabled = false;

  saveBtn.textContent =
    "💾 บันทึก";

}


/* =====================================================
   TOGGLE STATUS
===================================================== */

async function toggleStatus(id){

  const agent =
    agents.find(
      item => item.id === id
    );


  if(!agent){

    return;
  }


  const newStatus =
    agent.status === "active"
      ? "inactive"
      : "active";


  const question =
    newStatus === "inactive"
      ? "ต้องการปิดการใช้งานตัวแทนคนนี้ใช่ไหม?"
      : "ต้องการเปิดใช้งานตัวแทนคนนี้ใช่ไหม?";


  if(!confirm(question)){

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("agents")
      .update({

        status: newStatus

      })
      .eq(
        "id",
        id
      );


  if(error){

    console.error(error);

    showToast(
      "เปลี่ยนสถานะไม่สำเร็จ: " +
      error.message
    );

    return;
  }


  showToast(
    newStatus === "active"
      ? "เปิดใช้งานตัวแทนแล้ว 🟢"
      : "ปิดการใช้งานตัวแทนแล้ว 🔴"
  );


  await loadAgents();

}


/* =====================================================
   DELETE
===================================================== */

async function deleteAgent(id){

  const agent =
    agents.find(
      item => item.id === id
    );


  if(!agent){

    return;
  }


  const confirmed =
    confirm(
      "ต้องการลบตัวแทน " +
      (agent.nickname || "") +
      " (" +
      (agent.agent_code || "") +
      ") จริงหรือไม่?\n\n" +
      "การลบจะลบข้อมูลออกจากฐานข้อมูล"
    );


  if(!confirmed){

    return;
  }


  const secondConfirm =
    confirm(
      "ยืนยันอีกครั้งว่าต้องการลบข้อมูลตัวแทนคนนี้"
    );


  if(!secondConfirm){

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("agents")
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    console.error(error);

    showToast(
      "ลบไม่สำเร็จ: " +
      error.message
    );

    return;
  }


  showToast(
    "ลบตัวแทนเรียบร้อยแล้ว"
  );


  await loadAgents();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  if(!supabaseClient){

    return;
  }


  await supabaseClient.auth.signOut();


  adminPage.classList.add(
    "hidden"
  );

  loginPage.classList.remove(
    "hidden"
  );

/* =====================================================
   FORMAT
===================================================== */

function formatDate(date){

  if(!date){

    return "-";
  }


  try{

    return new Intl.DateTimeFormat(
      "th-TH",
      {
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"2-digit",
        minute:"2-digit"
      }
    ).format(
      new Date(date)
    );

  }catch{

    return date;

  }

}


function formatSalesChannel(channel){

  const map = {

    "Twitter":
      "ทวิต",

    "Facebook":
      "Facebook",

    "Instagram":
      "Instagram",

    "TikTok":
      "TikTok",

    "LINE":
      "LINE",

    "Other":
      "อื่น ๆ"

  };


  return (
    map[channel] ||
    channel
  );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttr(value){

  return escapeHtml(value);

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;


function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2600
    );

}
