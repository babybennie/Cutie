<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>เช็คสถานะตัวแทน | Bennie Choco</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Thai",
    sans-serif;
}

body{
  min-height:100vh;
  color:#5f5367;
  background:
    radial-gradient(circle at 10% 10%,rgba(255,255,255,.95),transparent 25%),
    radial-gradient(circle at 90% 15%,rgba(255,214,236,.75),transparent 28%),
    radial-gradient(circle at 20% 90%,rgba(210,232,255,.8),transparent 30%),
    linear-gradient(
      135deg,
      #fff7fb 0%,
      #f7f0ff 48%,
      #eef7ff 100%
    );
  overflow-x:hidden;
}

/* =========================
   Background decorations
========================= */

body::before,
body::after{
  content:"";
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  z-index:-1;
  filter:blur(2px);
}

body::before{
  width:220px;
  height:220px;
  background:rgba(255,190,222,.28);
  top:-80px;
  left:-80px;
}

body::after{
  width:260px;
  height:260px;
  background:rgba(185,218,255,.28);
  bottom:-110px;
  right:-100px;
}

/* =========================
   Main
========================= */

.page{
  width:min(92%,520px);
  margin:0 auto;
  padding:28px 0 40px;
}

/* =========================
   Header
========================= */

.header{
  text-align:center;
  margin-bottom:20px;
}

.logo{
  width:88px;
  height:88px;
  margin:0 auto 12px;
  border-radius:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      145deg,
      #fff,
      #ffe8f3
    );

  box-shadow:
    0 14px 35px rgba(150,110,145,.15),
    inset 0 0 0 1px rgba(255,255,255,.9);

  font-size:42px;
}

.header h1{
  margin:0;
  color:#695876;
  font-size:25px;
  font-weight:700;
  letter-spacing:.2px;
}

.header p{
  margin:7px 0 0;
  color:#96879e;
  font-size:14px;
  line-height:1.6;
}

/* =========================
   Card
========================= */

.card{
  background:rgba(255,255,255,.84);
  border:1px solid rgba(255,255,255,.95);
  border-radius:28px;

  padding:22px;

  box-shadow:
    0 18px 50px rgba(120,95,130,.13),
    inset 0 1px 0 rgba(255,255,255,.9);

  backdrop-filter:blur(12px);
}

/* =========================
   Form
========================= */

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin:0 0 7px 4px;
  color:#71627b;
  font-size:14px;
  font-weight:600;
}

.input{
  width:100%;
  height:50px;

  border:none;
  outline:none;

  padding:0 16px;

  border-radius:16px;

  background:#fff8fc;

  color:#55495e;
  font-size:15px;

  box-shadow:
    inset 0 0 0 1px #f0dfe9;
  
  transition:.2s;
}

.input:focus{
  background:#fff;
  box-shadow:
    0 0 0 3px rgba(221,185,218,.22),
    inset 0 0 0 1px #d9b9d8;
}

.input::placeholder{
  color:#b6a9b9;
}

/* =========================
   Search button
========================= */

.search-btn{
  width:100%;
  height:52px;

  border:none;
  border-radius:17px;

  margin-top:4px;

  cursor:pointer;

  color:#fff;

  font-size:16px;
  font-weight:700;

  background:
    linear-gradient(
      135deg,
      #d99bc5,
      #bfa8e8
    );

  box-shadow:
    0 10px 22px rgba(183,145,201,.25);

  transition:.2s;
}

.search-btn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 13px 27px rgba(183,145,201,.32);
}

.search-btn:active{
  transform:translateY(0);
}

.search-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

/* =========================
   Copy Website Button
========================= */

.copy-web-btn{
  width:100%;
  min-height:48px;

  border:none;
  border-radius:16px;

  margin-top:10px;

  cursor:pointer;

  color:#806b91;

  font-size:14px;
  font-weight:700;

  background:
    linear-gradient(
      135deg,
      #f8e9f4,
      #eee8ff
    );

  box-shadow:
    0 7px 18px rgba(160,130,175,.12);

  transition:.2s;
}

.copy-web-btn:hover{
  transform:translateY(-2px);

  box-shadow:
    0 10px 22px rgba(160,130,175,.18);
}

.copy-web-btn:active{
  transform:translateY(0);
}

.copy-web-btn.copied{
  background:
    linear-gradient(
      135deg,
      #e7f8ee,
      #eaf7f5
    );

  color:#579875;
}

/* =========================
   Message
========================= */

.message{
  display:none;
  margin-top:16px;
  padding:13px 15px;
  border-radius:15px;
  font-size:14px;
  line-height:1.5;
  text-align:center;
}

.message.show{
  display:block;
}

.message.error{
  background:#fff0f3;
  color:#bd687d;
  border:1px solid #ffd9e1;
}

.message.info{
  background:#f2efff;
  color:#806fa6;
  border:1px solid #e3dcff;
}

/* =========================
   Result
========================= */

.result{
  display:none;
  margin-top:20px;
}

.result.show{
  display:block;
}

.result-card{
  overflow:hidden;

  border-radius:25px;

  background:
    linear-gradient(
      145deg,
      #fff,
      #fff8fc
    );

  border:1px solid #f0e1eb;

  box-shadow:
    0 12px 32px rgba(120,95,130,.10);
}

/* top decoration */

.result-top{
  height:72px;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  background:
    linear-gradient(
      135deg,
      #f9dce9,
      #e9ddfa
    );

  overflow:hidden;
}

.result-top::before,
.result-top::after{
  content:"✦";
  position:absolute;
  color:rgba(255,255,255,.75);
  font-size:25px;
}

.result-top::before{
  left:30px;
  top:18px;
}

.result-top::after{
  right:35px;
  bottom:12px;
  font-size:18px;
}

.result-top-title{
  position:relative;
  z-index:1;

  color:#765d78;
  font-size:14px;
  font-weight:700;
  letter-spacing:.4px;
}

/* profile */

.profile{
  padding:20px;
  text-align:center;
}

.photo-wrap{
  width:108px;
  height:108px;

  margin:-54px auto 12px;

  position:relative;

  border-radius:50%;

  padding:5px;

  background:#fff;

  box-shadow:
    0 8px 25px rgba(130,100,135,.18);
}

.photo{
  width:100%;
  height:100%;

  border-radius:50%;

  object-fit:cover;

  background:
    linear-gradient(
      135deg,
      #f7ddeb,
      #e7def9
    );
}

.no-photo{
  display:flex;
  align-items:center;
  justify-content:center;

  width:100%;
  height:100%;

  border-radius:50%;

  font-size:43px;

  background:
    linear-gradient(
      135deg,
      #f9e1ed,
      #e8ddfa
    );
}

.nickname{
  margin:3px 0 4px;

  color:#66566d;

  font-size:21px;
  font-weight:700;
}

.agent-code{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:6px 13px;

  border-radius:20px;

  background:#f3edff;

  color:#846ca1;

  font-size:13px;
  font-weight:700;

  letter-spacing:.4px;
}

/* =========================
   Status
========================= */

.status-box{
  margin:17px 0 14px;

  padding:13px;

  border-radius:17px;
}

.status-box.active{
  background:#effaf3;
  border:1px solid #d5f0df;
}

.status-box.inactive{
  background:#fff3f1;
  border:1px solid #f5d9d3;
}

.status-label{
  display:block;
  margin-bottom:3px;

  font-size:12px;
  color:#958798;
}

.status{
  font-size:16px;
  font-weight:700;
}

.status-box.active .status{
  color:#51a878;
}

.status-box.inactive .status{
  color:#c8796c;
}

/* =========================
   Information
========================= */

.info-list{
  display:grid;
  gap:9px;
}

.info-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;

  padding:11px 13px;

  border-radius:14px;

  background:#fcf9fc;
}

.info-label{
  color:#9b8e9f;
  font-size:13px;
}

.info-value{
  color:#665a69;
  font-size:13px;
  font-weight:600;
  text-align:right;
}

/* =========================
   Sales channels
========================= */

.channels{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:5px;
}

.channel{
  padding:4px 8px;

  border-radius:10px;

  background:#f5effb;

  color:#806c8f;

  font-size:11px;
  font-weight:600;
}

/* =========================
   Buttons
========================= */

.bottom-actions{
  display:grid;
  gap:9px;
  margin-top:18px;
}

.bottom-btn{
  width:100%;
  min-height:45px;

  border:none;
  border-radius:15px;

  text-decoration:none;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:14px;
  font-weight:600;

  cursor:pointer;

  transition:.2s;
}

.bottom-btn:hover{
  transform:translateY(-1px);
}

.apply-btn{
  background:#fff0f7;
  color:#9b6685;
}

.home-btn{
  background:#eef3ff;
  color:#6d78a3;
}

/* =========================
   Music
========================= */

.music{
  position:fixed;

  right:16px;
  bottom:16px;

  z-index:50;

  width:52px;
  height:52px;

  border:none;
  border-radius:50%;

  cursor:pointer;

  background:
    linear-gradient(
      135deg,
      #f0c7df,
      #cfc2f0
    );

  color:#fff;

  font-size:21px;

  box-shadow:
    0 10px 25px rgba(130,105,145,.25);

  transition:.2s;
}

.music:hover{
  transform:scale(1.05);
}

.music.playing{
  animation:pulse 1.7s infinite;
}

@keyframes pulse{
  0%,100%{
    box-shadow:
      0 10px 25px rgba(130,105,145,.25);
  }
  50%{
    box-shadow:
      0 10px 32px rgba(185,140,205,.45);
  }
}

/* =========================
   Footer
========================= */

.footer{
  text-align:center;
  margin-top:20px;

  color:#aa9eae;
  font-size:12px;
  line-height:1.6;
}

.footer strong{
  color:#8d7795;
}

/* =========================
   Mobile
========================= */

@media(max-width:420px){

  .page{
    width:92%;
    padding-top:22px;
  }

  .header h1{
    font-size:23px;
  }

  .card{
    padding:18px;
    border-radius:24px;
  }

  .info-row{
    padding:10px;
  }

  .music{
    width:48px;
    height:48px;
    right:13px;
    bottom:13px;
  }
}
</style>
</head>

<body>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://jicsdzjcsxlrutdhurqd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_IutojmB0Mm9JrpPoBNc2rg_y300UcFz";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const checkForm =
  document.getElementById("checkForm");

const nicknameInput =
  document.getElementById("nickname");

const agentCodeInput =
  document.getElementById("agentCode");

const checkBtn =
  document.getElementById("checkBtn");

const copyWebBtn =
  document.getElementById("copyWebBtn");

const message =
  document.getElementById("message");

const result =
  document.getElementById("result");

const resultPhoto =
  document.getElementById("resultPhoto");

const noPhoto =
  document.getElementById("noPhoto");

const resultNickname =
  document.getElementById("resultNickname");

const resultCode =
  document.getElementById("resultCode");

const resultStatus =
  document.getElementById("resultStatus");

const statusBox =
  document.getElementById("statusBox");

const resultDate =
  document.getElementById("resultDate");

const resultChannels =
  document.getElementById("resultChannels");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text, type){

  message.textContent = text;

  message.className =
    "message show " + type;
}


function hideMessage(){

  message.textContent = "";

  message.className =
    "message";
}


/* =====================================================
   COPY WEBSITE LINK
===================================================== */

copyWebBtn.addEventListener(
  "click",
  async function(){

    const websiteUrl =
      window.location.href;


    try{

      await navigator.clipboard.writeText(
        websiteUrl
      );


      copyWebBtn.textContent =
        "✅ คัดลอกลิงก์แล้ว!";


      copyWebBtn.classList.add(
        "copied"
      );


      showMessage(
        "คัดลอกลิงก์เว็บเรียบร้อยแล้วค่ะ 💗 ส่งให้คนอื่นได้เลย",
        "info"
      );


      setTimeout(
        function(){

          copyWebBtn.textContent =
            "🔗 คัดลอกลิงก์เว็บ";

          copyWebBtn.classList.remove(
            "copied"
          );

        },
        2200
      );


    }catch(error){

      /*
        สำรองสำหรับเบราว์เซอร์ที่ไม่อนุญาต
        navigator.clipboard
      */

      try{

        const tempInput =
          document.createElement("input");

        tempInput.value =
          websiteUrl;

        document.body.appendChild(
          tempInput
        );

        tempInput.select();

        document.execCommand(
          "copy"
        );

        document.body.removeChild(
          tempInput
        );


        copyWebBtn.textContent =
          "✅ คัดลอกลิงก์แล้ว!";

        copyWebBtn.classList.add(
          "copied"
        );


        showMessage(
          "คัดลอกลิงก์เว็บเรียบร้อยแล้วค่ะ 💗",
          "info"
        );


        setTimeout(
          function(){

            copyWebBtn.textContent =
              "🔗 คัดลอกลิงก์เว็บ";

            copyWebBtn.classList.remove(
              "copied"
            );

          },
          2200
        );


      }catch(fallbackError){

        showMessage(
          "คัดลอกอัตโนมัติไม่ได้ค่ะ กรุณาคัดลอกลิงก์จากแถบด้านบนแทน",
          "error"
        );

      }

    }

  }
);


/* =====================================================
   RESET RESULT
===================================================== */

function clearResult(){

  result.classList.remove("show");

  resultPhoto.style.display = "none";

  noPhoto.style.display = "flex";

  resultNickname.textContent = "-";

  resultCode.textContent = "-";

  resultStatus.textContent = "-";

  resultDate.textContent = "-";

  resultChannels.innerHTML = "";

  statusBox.className =
    "status-box active";
}


/* =====================================================
   DATE
===================================================== */

function formatDate(dateString){

  if(!dateString){
    return "-";
  }

  const date =
    new Date(dateString);

  if(Number.isNaN(date.getTime())){
    return "-";
  }

  return date.toLocaleDateString(
    "th-TH",
    {
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );
}


/* =====================================================
   CHANNEL LABEL
===================================================== */

function formatChannel(channel){

  const map = {

    Facebook:"Facebook",

    Instagram:"Instagram",

    TikTok:"TikTok",

    Twitter:"𝕏 ทวิต",

    LINE:"LINE",

    Other:"อื่นๆ"

  };

  return map[channel] || channel;
}


/* =====================================================
   RENDER CHANNELS
===================================================== */

function renderChannels(channels){

  resultChannels.innerHTML = "";

  if(
    !Array.isArray(channels) ||
    channels.length === 0
  ){

    resultChannels.textContent =
      "-";

    return;
  }


  channels.forEach(channel => {

    const tag =
      document.createElement("span");

    tag.className =
      "channel";

    tag.textContent =
      formatChannel(channel);

    resultChannels.appendChild(tag);

  });

}


/* =====================================================
   RENDER RESULT
===================================================== */

function renderAgent(agent){

  resultNickname.textContent =
    agent.nickname || "-";

  resultCode.textContent =
    agent.agent_code || "-";

  resultDate.textContent =
    formatDate(agent.joined_date);


  renderChannels(
    agent.sales_channels
  );


  /* -------------------------
     STATUS
  ------------------------- */

  const isActive =
    agent.status === "active";


  if(isActive){

    statusBox.className =
      "status-box active";

    resultStatus.textContent =
      "🟢 ใช้งานอยู่";

  }else{

    statusBox.className =
      "status-box inactive";

    resultStatus.textContent =
      "🔴 ไม่ได้ใช้งาน";

  }


  /* -------------------------
     PHOTO
  ------------------------- */

  if(agent.photo_url){

    resultPhoto.src =
      agent.photo_url;

    resultPhoto.style.display =
      "block";

    noPhoto.style.display =
      "none";

    resultPhoto.onerror = function(){

      resultPhoto.style.display =
        "none";

      noPhoto.style.display =
        "flex";

    };

  }else{

    resultPhoto.style.display =
      "none";

    noPhoto.style.display =
      "flex";

  }


  result.classList.add("show");

}


/* =====================================================
   CHECK AGENT
===================================================== */

checkForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    hideMessage();

    clearResult();


    const nickname =
      nicknameInput.value.trim();

    const agentCode =
      agentCodeInput.value
        .trim()
        .toUpperCase();


    if(!nickname){

      showMessage(
        "กรุณากรอกชื่อตัวแทนค่ะ 💗",
        "error"
      );

      nicknameInput.focus();

      return;
    }


    if(!agentCode){

      showMessage(
        "กรุณากรอกรหัสตัวแทนค่ะ 🎫",
        "error"
      );

      agentCodeInput.focus();

      return;
    }


    checkBtn.disabled =
      true;

    checkBtn.textContent =
      "🔎 กำลังตรวจสอบ...";


    try{

      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "check_agent",
          {
            p_nickname:
              nickname,

            p_agent_code:
              agentCode
          }
        );


      if(error){

        console.error(
          "Supabase error:",
          error
        );

        throw error;

      }


      if(
        !data ||
        data.length === 0
      ){

        showMessage(
          "ไม่พบข้อมูลตัวแทนค่ะ 🥺 กรุณาตรวจสอบชื่อและรหัสตัวแทนอีกครั้ง",
          "error"
        );

        return;

      }


      const agent =
        Array.isArray(data)
          ? data[0]
          : data;


      renderAgent(agent);

      showMessage(
        "พบข้อมูลตัวแทนแล้วค่ะ 💗",
        "info"
      );


    }catch(error){

      console.error(error);

      showMessage(
        "เกิดข้อผิดพลาดในการเชื่อมต่อระบบ กรุณาลองใหม่อีกครั้งค่ะ",
        "error"
      );


    }finally{

      checkBtn.disabled =
        false;

      checkBtn.textContent =
        "🔎 ตรวจสอบสถานะ";

    }

  }
);


/* =====================================================
   AUTO FORMAT AGENT CODE
===================================================== */

agentCodeInput.addEventListener(
  "input",
  function(){

    this.value =
      this.value
        .toUpperCase()
        .replace(/\s+/g,"");

  }
);


/* =====================================================
   MUSIC
===================================================== */

const music =
  document.getElementById("bgMusic");

const musicBtn =
  document.getElementById("musicBtn");


let musicPlaying =
  false;


musicBtn.addEventListener(
  "click",
  async function(){

    try{

      if(musicPlaying){

        music.pause();

        musicPlaying =
          false;

        musicBtn.textContent =
          "🎵";

        musicBtn.classList.remove(
          "playing"
        );

      }else{

        await music.play();

        musicPlaying =
          true;

        musicBtn.textContent =
          "🔊";

        musicBtn.classList.add(
          "playing"
        );

      }

    }catch(error){

      console.error(
        "Music error:",
        error
      );

      showMessage(
        "ยังเปิดเพลงไม่ได้ค่ะ กรุณาตรวจสอบไฟล์ music.mp3",
        "error"
      );

    }

  }
);


/* =====================================================
   MUSIC STATE
===================================================== */

music.addEventListener(
  "pause",
  function(){

    musicPlaying =
      false;

    musicBtn.textContent =
      "🎵";

    musicBtn.classList.remove(
      "playing"
    );

  }
);


music.addEventListener(
  "play",
  function(){

    musicPlaying =
      true;

    musicBtn.textContent =
      "🔊";

    musicBtn.classList.add(
      "playing"
    );

  }
);

</script>
